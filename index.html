<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050608">
    <meta name="description" content="Killian Fit training command center.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Killian Fit">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Killian Fit</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-rail" aria-label="Primary">
        <a class="brand" href="#dashboard" aria-label="Killian Fit dashboard">
          <span class="brand-mark" aria-hidden="true">KF</span>
          <span>
            <strong>Killian Fit</strong>
            <small>Training OS</small>
          </span>
        </a>
        <nav id="railNav" class="rail-nav"></nav>
      </aside>

      <div class="app-frame">
        <header class="topbar">
          <a class="mobile-brand" href="#dashboard" aria-label="Killian Fit dashboard">
            <span class="brand-mark" aria-hidden="true">KF</span>
            <span>
              <strong>Killian Fit</strong>
              <small>Train Hard. Track Everything.</small>
            </span>
          </a>
          <div class="topbar-actions">
            <button class="icon-button" type="button" data-action="quick-rest" title="Start rest timer" aria-label="Start rest timer">
              <span class="icon-clock" aria-hidden="true"></span>
            </button>
            <a class="primary-link" href="#today">Train</a>
          </div>
        </header>

        <main id="app" class="screen" tabindex="-1"></main>

        <nav id="bottomNav" class="bottom-nav" aria-label="Primary mobile"></nav>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modalRoot"></div>

    <script src="./app.js"></script>
  </body>
</html>
